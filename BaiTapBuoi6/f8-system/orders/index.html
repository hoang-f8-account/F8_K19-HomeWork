<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders — F8 System</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/theme.css">
</head>
<body>

    <!--
      Phan tu 3 — CSS Priority Bay (orders/index.html)
      Phan tu nay co: tag(h1) + Inline style + External CSS (base.css, theme.css)
      - base.css: h1 = #1a237e
      - Inline style: color: #9c27b0 (tim sang)
      - Specificity: Inline style (1000) > h1 tag (1)
      - Selector thang: Inline style (specificity cao nhat = 1000)
      - Mau hien thi: #9c27b0 (tim sang — mau inline style)
    -->
    <h1 style="color: #9c27b0;">ORDERS PAGE</h1>

    <!--
      Phan tu nay co: tag(h2) + class(.title) + id(#special) + Inline style + External CSS
      - base.css: h2(1) | .title(10) | #special(100)
      - theme.css: override h2, .title, #special
      - Inline style: color: #00bcd4 (xanh ngoc)
      - Specificity: Inline(1000) > #special(100) > .title(10) > h2(1)
      - Selector thang: Inline style (1000 — cao nhat tuyet doi)
      - Mau hien thi: #00bcd4 (xanh ngoc — mau inline style)
      - Quan sat: du co ca .title + #special, inline style van thang tat ca
    -->
    <h2 class="title" id="special" style="color: #00bcd4;">Danh sach don hang</h2>

    <!--
      p + inline style: Inline style thang tag p
      - Specificity: Inline(1000) > p(1)
      - Mau hien thi: #ff5722 (cam san)
    -->
    <p style="color: #ff5722;">Don hang 001</p>

    <!-- p + inline style -->
    <p style="color: #4caf50;">Don hang 002</p>

    <!-- p.highlight: specificity .highlight(10) > p(1) => mau base.css: #f57f17 -->
    <p class="highlight">Don hang 003</p>

    <!-- p.highlight -->
    <p class="highlight">Don hang 004</p>

</body>
</html>
